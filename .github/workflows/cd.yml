name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: production
        type: choice
        options:
          - production

permissions:
  contents: read
  packages: write

env:
  VERSION: "1.0.0"

jobs:
  build-and-push:
    name: Build and push image

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      image-name: ${{ steps.meta.outputs.image-name }}
      short-sha: ${{ steps.meta.outputs.short-sha }}
      full-sha: ${{ steps.meta.outputs.full-sha }}

    steps:
      - name: Determine commit SHA
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            FULL_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            FULL_SHA="${GITHUB_SHA}"
          fi

          SHORT_SHA="${FULL_SHA::7}"
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"

          echo "image-name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "short-sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "full-sha=$FULL_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.full-sha }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image-name }}:latest
            ${{ steps.meta.outputs.image-name }}:${{ steps.meta.outputs.short-sha }}
            ${{ steps.meta.outputs.image-name }}:v${{ env.VERSION }}

  deploy:
    name: Deploy

    needs:
      - build-and-push

    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-push.outputs.full-sha }}
          fetch-depth: 2

      - name: Determine previous SHA
        id: previous
        shell: bash
        run: |
          PREVIOUS_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"

          if [ -n "$PREVIOUS_SHA" ]; then
            PREVIOUS_SHORT_SHA="${PREVIOUS_SHA::7}"
          else
            PREVIOUS_SHORT_SHA=""
          fi

          echo "short-sha=$PREVIOUS_SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy application
        shell: bash
        run: |
          ./deploy/deploy.sh \
            "${{ needs.build-and-push.outputs.image-name }}" \
            "${{ needs.build-and-push.outputs.short-sha }}" \
            "${{ steps.previous.outputs.short-sha }}"
