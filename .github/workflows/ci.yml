name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python and dependencies
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"

      - name: Run Flake8
        run: flake8 app.py test_app.py --max-line-length=100

  yaml-lint:
    name: Lint YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Run YAML lint
        run: |
          yamllint .github docker-compose.yml .yamllint.yml

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: true
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      REDIS_HOST: localhost

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python and dependencies
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run tests
        run: |
          pytest \
            --junitxml=reports/junit-${{ matrix.python-version }}.xml \
            --cov=app \
            --cov-report=xml:reports/coverage-${{ matrix.python-version }}.xml \
            --cov-report=term

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-python-${{ matrix.python-version }}
          path: reports/

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - lint
      - yaml-lint
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t evaluation-devops:ci .

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs:
      - lint
      - yaml-lint
      - test
      - build

    if: always()

    steps:
      - name: Download test artifacts
        if: needs.test.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: test-reports-python-*
          path: downloaded-reports
          merge-multiple: true

      - name: Verify all CI jobs
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "YAML lint: ${{ needs.yaml-lint.result }}"
          echo "Tests: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"

          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.yaml-lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "CI failed"
            exit 1
          fi

          echo "CI passed successfully"
